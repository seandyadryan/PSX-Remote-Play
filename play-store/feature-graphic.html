<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSX Remote Play — feature graphic</title>
  <style>
    *{box-sizing:border-box}html,body{width:1024px;height:500px;margin:0;overflow:hidden;background:#0d1420}
    body{position:relative;color:#edf4fa;font-family:"Segoe UI",Arial,sans-serif}
    .art{position:absolute;inset:0;width:1024px;height:500px;object-fit:cover}
    .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,20,32,.9) 0%,rgba(13,20,32,.65) 32%,transparent 60%)}
    main{position:absolute;left:54px;top:49px;width:425px}.eyebrow{color:#8cf5cd;font-size:12px;letter-spacing:2.5px;font-weight:650}
    h1{font-size:66px;line-height:1.02;letter-spacing:-2.8px;margin:24px 0 22px;font-weight:750}
    p{font-size:23px;line-height:1.4;color:#c0d0df;margin:0;letter-spacing:-.3px}
    .badge{display:inline-block;margin-top:28px;padding:9px 13px;border:1px solid #598575;border-radius:7px;color:#8cf5cd;background:rgba(13,20,32,.7);font-size:10px;font-weight:700;letter-spacing:1.8px}
  </style>
</head>
<body>
  <img class="art" src="artwork/connection-illustration.png" alt="Original illustration of an unbranded controller and phone connected by luminous network arcs.">
  <div class="shade"></div>
  <main><div class="eyebrow">INDEPENDENT ANDROID CLIENT</div><h1>PSX<br>Remote Play</h1><p>Your console.<br>Your local connection.</p><div class="badge">EXPERIMENTAL LAN VERSION</div></main>
</body>
</html>
